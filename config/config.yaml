# Main pipeline configuration.
# Thresholds are placeholders - tune once real data distributions have been reviewed.

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  results_dir: results
  columns: config/columns.yaml
  gene_phenotypes: config/gene_phenotypes.yaml
  gene_bed: resources/panel/monopdaus-genes.grch38.bed
  exon_bed: resources/panel/monopdaus-exons.grch38.bed

inputs:
  panel: resources/panel/monopdaus-gene-inheritance.csv
  expression: null
  splicevault: null
  prs_weights: null

genome_build: GRCh38

# Legacy/alias symbol -> symbol used throughout (applied to VEP symbols and the panel).
gene_aliases:
  GBA: GBA1

filters:
  restrict_to_panel: true
  max_gnomad_af: 0.01          # global gnomAD AF
  max_gnomad_popmax_af: 0.01   # ancestry-specific max AF
  max_gnomad_hom: 5            # for AD genes, many homozygotes in gnomAD argues against pathogenicity
  # Relaxed AF ceilings for panel genes flagged risk_allele_exception (e.g. GBA1 E326K,
  # LRRK2 G2385R, TMEM175 M393T are too common for the Mendelian thresholds above).
  risk_exception_max_af: 0.05
  min_depth: 10
  min_gq: 20
  min_allele_balance: 0.2
  # Soften depth-only QC failures (GQ / allele balance still enforced):
  # - near-miss: HIGH-impact panel alleles with depth >= min_depth / factor (e.g. 10/2 -> 5)
  # - lof_del: alleles inside a same-sample LoF / exon-disrupting DEL down to this floor
  # Set either key to null to disable that rescue path.
  depth_rescue_near_miss_factor: 2.0
  depth_rescue_lof_del_min_depth: 5
  depth_rescue_high_impact_consequences:
    - transcript_ablation
    - splice_acceptor_variant
    - splice_donor_variant
    - stop_gained
    - frameshift_variant
    - stop_lost
    - start_lost
  # Consequences retained (VEP terms). Splice-region / intronic kept so Introme can rescue them.
  keep_consequences:
    - transcript_ablation
    - splice_acceptor_variant
    - splice_donor_variant
    - stop_gained
    - frameshift_variant
    - stop_lost
    - start_lost
    - inframe_insertion
    - inframe_deletion
    - missense_variant
    - protein_altering_variant
    - splice_region_variant
    - splice_donor_5th_base_variant
    - splice_donor_region_variant
    - splice_polypyrimidine_tract_variant
    - synonymous_variant
    - intron_variant
    - 5_prime_UTR_variant
    - 3_prime_UTR_variant
    - copy_number_gain
    - structural_variant
    - short_tandem_repeat_variant
    - mitochondrial_variant
  # Always keep ClinVar P/LP regardless of frequency/consequence filters.
  always_keep_clinvar_plp: true
  # Off-panel STR / GBA1 / mtDNA rows. Quality filters still apply.
  # TTN truncations are kept even when TTN is off the panel and tagged incidental.
  always_keep_sources:
    - expansionhunter
    - gauchian
    - mtdna

scoring:
  # Each rule adds `points` to the evidence score when satisfied.
  cadd_high: 25
  cadd_moderate: 20
  revel_high: 0.7
  # Eigen-phred_coding from academic dbNSFP 5.4a. Higher is more deleterious; 10 is a triage band only.
  # fathmm_damaging uses fathmm-XF_coding_pred (D when score > 0.5) from the same build.
  # Splice evidence comes from Introme (introme_high), not a separate VEP SpliceAI column.
  eigen_high: 10
  # AlphaGenome Atlas AVI Phred. Phred = -10 log10(1 - CDF) against all GRCh38 SNVs
  # (Cheng et al. medRxiv 2026, doi:10.64898/2026.09.16.26363192).
  # 30 is the top 0.1% and 20 is the top 1%. These are rank bands, not pathogenicity calls.
  avi_high: 30
  avi_moderate: 20
  points:
    clinvar_plp: 10
    clinvar_conflicting: 3
    clinvar_blb: -10
    null_variant: 8          # stop_gained, frameshift, canonical splice, start_lost, transcript_ablation
    # Scored LoF SVs lack ClinVar/CADD/REVEL/AVI; bonus on top of null_variant so they reach tier 1.
    sv_dosage_lof: 8
    cadd_high: 3
    cadd_moderate: 1
    revel_high: 3
    avi_high: 3
    avi_moderate: 1
    sift_deleterious: 1
    polyphen_damaging: 1
    muttaster_disease: 1
    fathmm_damaging: 1
    eigen_high: 1
    introme_high: 5
    absent_gnomad: 2
  tiers:
    # Evaluated top-down; first matching tier wins.
    tier1_min_score: 10
    tier2_min_score: 6
    tier3_min_score: 3

splicing:
  introme_high: 0.7          # placeholder - set from Introme documentation / calibration
  introme_moderate: 0.6
  # Second-allele lookup inside this sample. gnomAD AF is applied only when the
  # Introme table already carries gnomad_af (from the VEP custom annotation).
  lookup_min_score: 0.7
  lookup_max_gnomad_af: 0.01
  # Consequences where Introme is expected to add information beyond SpliceAI
  consider_consequences:
    - splice_region_variant
    - splice_donor_5th_base_variant
    - splice_donor_region_variant
    - splice_polypyrimidine_tract_variant
    - intron_variant
    - synonymous_variant
    - missense_variant

inheritance:
  # Minimum tier a variant needs to count as a qualifying hit in each MOI context.
  ad_min_tier: 2
  ar_first_hit_min_tier: 3
  ar_second_hit_min_tier: 3
  allow_introme_second_hit: true
  unknown_moi_min_tier: 2    # panel genes with inheritance "unknown" (low-confidence candidates)

phenotype:
  early_onset_age: 50        # EOPD threshold
  juvenile_onset_age: 21

report:
  max_candidates_per_patient: 20
  excel_filename: curation_sheet.xlsx

sv:
  auto_index: true
  exclude_filters:
    - HIGH_ALGORITHM_FDR
    - HIGH_NCR
    - UNRESOLVED
  # Mechanism labels. LoF SVs use null_variant + sv_dosage_lof; SNCA copy-gain reuses null_variant as sv_dosage_gain.
  dosage_rules:
    - gene: SNCA
      effect: copy_gain
      citation: "Singleton AB et al. Science. 2003;302:841. Chartier-Harlin MC et al. Lancet. 2004;364:1167."
    - gene: PRKN
      effect: lof
      citation: "Kitada T et al. Nature. 1998;392:605. GeneReviews Parkinson Disease Overview (NBK1223)."

compound:
  statistical_phasing:
    enabled: false
    reference_panel: null

expression:
  resource: null
  min_brain_pext: null
  min_gtex_tpm: null
  unexpressed_weight: null

liability:
  # From panel notes, not a percentage. Heterozygous findings in these genes are partially_explained.
  reduced_penetrance_genes:
    - GBA1
    - LRRK2
  # Numeric penetrance stays null until a value and a citation are both set.
  penetrance: {}
  prs_weights: null
  prs_beta: null
  prs_beta_citation: null
  sex_coefficient: null
  sex_coefficient_citation: null
  age_coefficient: null
  age_coefficient_citation: null

biomarkers:
  gene_classes:
    recessive_eopd: [PRKN, PINK1, PARK7, ATP13A2, VPS13C, SYNJ1, DNAJC6]
    synucleinopathy: [SNCA, GBA1]
    dystonia_parkinsonism: [PRKN, ATP13A2, PLA2G6, DNAJC6, FBXO7]
  fields:
    age_onset: [age_onset, age_at_onset]
    saa: [saa, alpha_synuclein_saa, asyn_saa]
    datscan: [datscan, dat_scan]
    dystonia_at_onset: [dystonia_at_onset]
    dementia: [dementia]
    levodopa_response: [levodopa_response, levodopa]
  rules:
    - id: early_onset
      field: age_onset
      gene_class: recessive_eopd
      use_early_onset_age: true
      direction: recessive_eopd
      multiplier: null
      citation: null
    - id: dystonia_at_onset
      field: dystonia_at_onset
      gene_class: dystonia_parkinsonism
      equals: ["true", "yes", "positive"]
      direction: dystonia_parkinsonism
      multiplier: null
      citation: null
    - id: dementia
      field: dementia
      gene_class: synucleinopathy
      equals: ["true", "yes", "positive"]
      direction: synucleinopathy
      multiplier: null
      citation: null
    - id: saa_positive
      field: saa
      gene_class: synucleinopathy
      equals: ["true", "yes", "positive"]
      direction: synucleinopathy
      multiplier: null
      citation: "Siderowf A et al. Lancet Neurol. 2023. Assessment of heterogeneity among participants in the Parkinson's Progression Markers Initiative cohort using alpha-synuclein seed amplification."
    - id: levodopa_response
      field: levodopa_response
      gene_class: recessive_eopd
      equals: ["true", "yes", "positive"]
      direction: flag_only
      multiplier: null
      citation: null

# Repeat-locus catalogue for PD / parkinsonism / adult ataxia differentials.
# Keys must match ExpansionHunter INFO/REPID (or VARID) when the locus is in the
# vendored catalog. FGF14, BEAN1, LRP12, and NOTCH2NLC are PD-relevant but not in
# workflow/assets/expansionhunter_pd.hg38.json yet; cutoffs are still recorded for
# triage when those loci are added. pathogenic_min_repeats is the lowest cited
# disease-associated (or FXTAS-premutation) allele size used by _expanded(); it is
# not a full ACMG classification. Motif purity, interruptions, and biallelic
# requirement (RFC1, CSTB, FXN) are not modelled here.
str_loci:
  # --- In ExpansionHunter PD catalog (REPID) ---
  ATXN1:
    gene: ATXN1
    pathogenic_min_repeats: 39
    citation: "GeneReviews SCA1 (NBK1184): full-penetrance ≥39 uninterrupted CAG (CAT interruptions can non-pathogenise 39–44)"
  ATXN2:
    gene: ATXN2
    pathogenic_min_repeats: 33
    citation: "GeneReviews SCA2 (NBK1275): disease-associated ≥33 CAG (33–34 reduced penetrance; >34 full)"
  ATXN3:
    gene: ATXN3
    pathogenic_min_repeats: 60
    citation: "GeneReviews SCA3 (NBK1196): full-penetrance ~60–87 CAG (intermediate from ~45; smallest full-penetrance poorly defined)"
  CACNA1A:
    gene: CACNA1A
    pathogenic_min_repeats: 20
    citation: "GeneReviews SCA6 (NBK1140): full-penetrance 20–33 CAG (19 uncertain)"
  ATXN7:
    gene: ATXN7
    pathogenic_min_repeats: 34
    citation: "GeneReviews SCA7 (NBK1256): pathogenic from 34–36 CAG reduced penetrance; ≥37 full penetrance"
  ATXN8OS:
    gene: ATXN8OS
    pathogenic_min_repeats: 71
    citation: "GeneReviews SCA8 (NBK1268): pathogenic table ≥71 combined CTA+CTG (higher-penetrance alleles often 54–250; EH ATXN8OS REPID is the CTG tract alone)"
  ATXN10:
    gene: ATXN10
    pathogenic_min_repeats: 800
    citation: "GeneReviews SCA10 (NBK1175) / GeneReviews repeat table (NBK535148): full-penetrance ≥800 ATTCT (intermediate ~280–799)"
  PPP2R2B:
    gene: PPP2R2B
    pathogenic_min_repeats: 51
    citation: "GeneReviews SCA12 historical (NBK1202) / repeat table (NBK535148): ≥51 CAG diagnostic (some cohorts report ≥43)"
  TBP:
    gene: TBP
    pathogenic_min_repeats: 41
    citation: "GeneReviews SCA17 (NBK1438): disease-associated usually >41 CAG/CAA (reduced penetrance 41–48; full-penetrance often ≥49 per NBK535148)"
  FMR1:
    gene: FMR1
    pathogenic_min_repeats: 55
    citation: "GeneReviews FMR1 disorders (NBK1384): FXTAS/FXPOI premutation ~55–200 CGG (full mutation >200 causes FXS; PD triage uses premutation floor)"
  C9ORF72:
    gene: C9ORF72
    pathogenic_min_repeats: 61
    citation: "GeneReviews C9orf72-FTD/ALS (NBK268647): pathogenic ≥61 GGGGCC (25–60 uncertain significance)"
  RFC1:
    gene: RFC1
    pathogenic_min_repeats: 250
    citation: "GeneReviews RFC1-related disorders (NBK564656): pathogenic AAGGG usually 250 to >2000 (often ≥400); disease is biallelic and motif-specific — EH size alone is a triage flag"
  HTT:
    gene: HTT
    pathogenic_min_repeats: 36
    citation: "GeneReviews Huntington disease (NBK1305): HD-causing ≥36 CAG (36–39 reduced penetrance; ≥40 full penetrance)"
  AR:
    gene: AR
    pathogenic_min_repeats: 38
    citation: "GeneReviews repeat table (NBK535148): SBMA full-penetrance ≥38 CAG (normal ≤34)"
  ATN1:
    gene: ATN1
    pathogenic_min_repeats: 48
    citation: "GeneReviews DRPLA (NBK1491): full-penetrance ≥48 CAG (intermediate/reduced 35–47)"
  NOP56:
    gene: NOP56
    pathogenic_min_repeats: 650
    citation: "GeneReviews repeat table (NBK535148): SCA36 ≥650 GGCCTG"
  JPH3:
    gene: JPH3
    pathogenic_min_repeats: 40
    citation: "GeneReviews repeat table (NBK535148): HDL2 ≥40 CTG"
  GIPC1:
    gene: GIPC1
    pathogenic_min_repeats: 73
    citation: "GeneReviews repeat table (NBK535148): OPDM2 GGC 73–164"
  CSTB:
    gene: CSTB
    pathogenic_min_repeats: 30
    citation: "GeneReviews repeat table (NBK535148): EPM1 ≥30 dodecamer; AR — biallelic expansion required"
  # --- PD-relevant, not yet in vendored EH catalog ---
  NOTCH2NLC:
    gene: NOTCH2NLC
    pathogenic_min_repeats: 66
    citation: "GeneReviews repeat table (NBK535148): NIID GGC ≥66 (normal <38); NIID/parkinsonism spectrum"
  FGF14:
    gene: FGF14
    pathogenic_min_repeats: 250
    citation: "GeneReviews GAA-FGF14 ataxia / SCA27B (NBK599589): likely pathogenic (reduced penetrance) 250–300 GAA; pathogenic >300 (pure GAA required)"
  BEAN1:
    gene: BEAN1
    pathogenic_min_repeats: null
    citation: "GeneReviews repeat table (NBK535148): SCA31 is a 2.5–3.8 kb TGGAA intronic insertion — no single EH repeat-count cutoff; leave null until catalog units are defined"
  LRP12:
    gene: LRP12
    pathogenic_min_repeats: null
    citation: "GeneReviews repeat table (NBK535148): OPDM CGG/CGT normal 13–45; full-penetrance pathogenic repeat number not established"
  FXN:
    gene: FXN
    pathogenic_min_repeats: 66
    citation: "GeneReviews repeat table (NBK535148): Friedreich ataxia ≥66 GAA; AR — biallelic expansion required; adult ataxia differential"
