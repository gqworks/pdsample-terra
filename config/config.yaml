# Main pipeline configuration.
# Thresholds are placeholders - tune once real data distributions have been reviewed.

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  results_dir: results
  columns: config/columns.yaml
  gene_phenotypes: config/gene_phenotypes.yaml
  gene_bed: resources/panel/monopdaus-genes.grch38.bed
  exon_bed: resources/panel/monopdaus-exons.grch38.bed

inputs:
  panel: resources/panel/monopdaus-gene-inheritance.csv
  # GBA1-PD Browser single-variant extract (Parlar et al. Mov Disord 2023).
  # Joined onto Gauchian catalog SNVs for PD severity class + score bump.
  gba1_pd_browser: resources/gba1/gba1_pd_browser.tsv
  expression: null
  splicevault: null
  prs_weights: null

genome_build: GRCh38

# Legacy/alias symbol -> symbol used throughout (applied to VEP symbols and the panel).
gene_aliases:
  GBA: GBA1

filters:
  restrict_to_panel: true
  max_gnomad_af: 0.01          # global gnomAD AF
  max_gnomad_popmax_af: 0.01   # ancestry-specific max AF
  max_gnomad_hom: 5            # for AD genes, many homozygotes in gnomAD argues against pathogenicity
  # Relaxed AF ceilings for panel genes flagged risk_allele_exception (e.g. GBA1 E326K,
  # LRRK2 G2385R, TMEM175 M393T are too common for the Mendelian thresholds above).
  risk_exception_max_af: 0.05
  min_depth: 10
  min_gq: 20
  min_allele_balance: 0.2
  # Soften depth-only QC failures (GQ / allele balance still enforced):
  # - near-miss: HIGH-impact panel alleles with depth >= min_depth / factor (e.g. 10/2 -> 5)
  # - lof_del: alleles inside a same-sample LoF / exon-disrupting DEL down to this floor
  # Set either key to null to disable that rescue path.
  depth_rescue_near_miss_factor: 2.0
  depth_rescue_lof_del_min_depth: 5
  depth_rescue_high_impact_consequences:
    - transcript_ablation
    - splice_acceptor_variant
    - splice_donor_variant
    - stop_gained
    - frameshift_variant
    - stop_lost
    - start_lost
  # Consequences retained (VEP terms). Splice-region / intronic kept so Introme can rescue them.
  keep_consequences:
    - transcript_ablation
    - splice_acceptor_variant
    - splice_donor_variant
    - stop_gained
    - frameshift_variant
    - stop_lost
    - start_lost
    - inframe_insertion
    - inframe_deletion
    - missense_variant
    - protein_altering_variant
    - splice_region_variant
    - splice_donor_5th_base_variant
    - splice_donor_region_variant
    - splice_polypyrimidine_tract_variant
    - synonymous_variant
    - intron_variant
    - 5_prime_UTR_variant
    - 3_prime_UTR_variant
    - copy_number_gain
    - structural_variant
    - short_tandem_repeat_variant
    - mitochondrial_variant
  # Always keep ClinVar P/LP regardless of frequency/consequence filters.
  always_keep_clinvar_plp: true
  # Off-panel STR / GBA1 / mtDNA rows. Quality filters still apply.
  # TTN truncations are kept even when TTN is off the panel and tagged incidental.
  always_keep_sources:
    - expansionhunter
    - gauchian
    - mtdna

scoring:
  # Each rule adds `points` to the evidence score when satisfied.
  cadd_high: 25
  cadd_moderate: 20
  revel_high: 0.7
  # Eigen-phred_coding from academic dbNSFP 5.4a. Higher is more deleterious; 10 is a triage band only.
  # fathmm_damaging uses fathmm-XF_coding_pred (D when score > 0.5) from the same build.
  # Splice evidence comes from Introme (introme_high), not a separate VEP SpliceAI column.
  eigen_high: 10
  # AlphaGenome Atlas AVI Phred. Phred = -10 log10(1 - CDF) against all GRCh38 SNVs
  # (Cheng et al. medRxiv 2026, doi:10.64898/2026.09.16.26363192).
  # 30 is the top 0.1% and 20 is the top 1%. These are rank bands, not pathogenicity calls.
  avi_high: 30
  avi_moderate: 20
  # MitImpact MLC (mitochondrial local constraint). Deleterious band is score >= 0.5.
  mlc_high: 0.5
  points:
    clinvar_plp: 10
    clinvar_conflicting: 3
    clinvar_blb: -10
    null_variant: 8          # stop_gained, frameshift, canonical splice, start_lost, transcript_ablation
    # Scored LoF SVs lack ClinVar/CADD/REVEL/AVI; bonus on top of null_variant so they reach tier 1.
    sv_dosage_lof: 8
    cadd_high: 3
    cadd_moderate: 1
    revel_high: 3
    avi_high: 3
    avi_moderate: 1
    sift_deleterious: 1
    polyphen_damaging: 1
    muttaster_disease: 1
    fathmm_damaging: 1
    eigen_high: 1
    introme_high: 4
    absent_gnomad: 2
    # mtDNA (MitImpact): MITOMAP confirmed P/LP, APOGEE2 Pathogenic/Likely-pathogenic, MitoTIP Q1.
    mitomap_pathogenic: 8
    apogee_pathogenic: 3
    mitotip_likely_pathogenic: 3
    mlc_high: 1
    # GBA1-PD Browser class bumps for Gauchian catalog SNVs only (not VEP rows).
    gba1_pd_severe: 4
    gba1_pd_mild: 2
    gba1_pd_risk: 1
  tiers:
    # Evaluated top-down; first matching tier wins.
    tier1_min_score: 10
    tier2_min_score: 6
    tier3_min_score: 3

# mtDNA curation gates applied when ingesting the MitochondriaPipeline VCF.
mtdna:
  min_heteroplasmy: 0.01          # inclusive; FORMAT AF as a fraction (1%)
  require_mitomap_entry: true     # keep only rows with MITOMAP_Disease_GenBank_Freq

splicing:
  introme_high: 0.9
  introme_moderate: 0.6
  # Introme scores are merged onto sample-callset alleles only (no carrier-table injection).
  # Consequences where Introme is expected to add information beyond SpliceAI
  consider_consequences:
    - splice_region_variant
    - splice_donor_5th_base_variant
    - splice_donor_region_variant
    - splice_polypyrimidine_tract_variant
    - intron_variant
    - synonymous_variant
    - missense_variant

inheritance:
  # Minimum tier a variant needs to count as a qualifying hit in each MOI context.
  ad_min_tier: 2
  ar_first_hit_min_tier: 3
  ar_second_hit_min_tier: 3
  allow_introme_second_hit: true
  unknown_moi_min_tier: 2    # panel genes with inheritance "unknown" (low-confidence candidates)

phenotype:
  early_onset_age: 50        # EOPD threshold
  juvenile_onset_age: 21

report:
  max_candidates_per_patient: 20
  excel_filename: curation_sheet.xlsx

sv:
  auto_index: true
  # Ingest keeps FILTER=PASS or MULTIALLELIC. Listed tags document common drop reasons.
  exclude_filters:
    - HIGH_ALGORITHM_FDR
    - HIGH_NCR
    - UNRESOLVED
    # Depth-only small DELs / WGD-outlier depth calls — common IGV "choppy dip" artifacts.
    - DEPTH_LT_5KB
    - SAMPLE_WGD_OUTLIER
  # Mechanism labels. LoF SVs use null_variant + sv_dosage_lof; SNCA copy-gain reuses null_variant as sv_dosage_gain.
  dosage_rules:
    - gene: SNCA
      effect: copy_gain
      citation: "Singleton AB et al. Science. 2003;302:841. Chartier-Harlin MC et al. Lancet. 2004;364:1167."
    - gene: PRKN
      effect: lof
      citation: "Kitada T et al. Nature. 1998;392:605. GeneReviews Parkinson Disease Overview (NBK1223)."

compound:
  statistical_phasing:
    enabled: false
    reference_panel: null

expression:
  resource: null
  min_brain_pext: null
  min_gtex_tpm: null
  unexpressed_weight: null

liability:
  # From panel notes, not a percentage. Heterozygous findings in these genes are partially_explained.
  reduced_penetrance_genes:
    - GBA1
    - LRRK2
  # Numeric penetrance stays null until a value and a citation are both set.
  penetrance: {}
  prs_weights: null
  prs_beta: null
  prs_beta_citation: null
  sex_coefficient: null
  sex_coefficient_citation: null
  age_coefficient: null
  age_coefficient_citation: null

biomarkers:
  gene_classes:
    recessive_eopd: [PRKN, PINK1, PARK7, ATP13A2, VPS13C, SYNJ1, DNAJC6]
    synucleinopathy: [SNCA, GBA1]
    dystonia_parkinsonism: [PRKN, ATP13A2, PLA2G6, DNAJC6, FBXO7]
  fields:
    age_onset: [age_onset, age_at_onset]
    saa: [saa, alpha_synuclein_saa, asyn_saa]
    datscan: [datscan, dat_scan]
    dystonia_at_onset: [dystonia_at_onset]
    dementia: [dementia]
    levodopa_response: [levodopa_response, levodopa]
  rules:
    - id: early_onset
      field: age_onset
      gene_class: recessive_eopd
      use_early_onset_age: true
      direction: recessive_eopd
      multiplier: null
      citation: null
    - id: dystonia_at_onset
      field: dystonia_at_onset
      gene_class: dystonia_parkinsonism
      equals: ["true", "yes", "positive"]
      direction: dystonia_parkinsonism
      multiplier: null
      citation: null
    - id: dementia
      field: dementia
      gene_class: synucleinopathy
      equals: ["true", "yes", "positive"]
      direction: synucleinopathy
      multiplier: null
      citation: null
    - id: saa_positive
      field: saa
      gene_class: synucleinopathy
      equals: ["true", "yes", "positive"]
      direction: synucleinopathy
      multiplier: null
      citation: "Siderowf A et al. Lancet Neurol. 2023. Assessment of heterogeneity among participants in the Parkinson's Progression Markers Initiative cohort using alpha-synuclein seed amplification."
    - id: levodopa_response
      field: levodopa_response
      gene_class: recessive_eopd
      equals: ["true", "yes", "positive"]
      direction: flag_only
      multiplier: null
      citation: null

# Repeat-locus catalogue for PD / parkinsonism / adult ataxia differentials.
# Keys must match ExpansionHunter INFO/REPID (or VARID) when the locus is in the
# vendored catalog. FGF14, BEAN1, LRP12, and NOTCH2NLC are PD-relevant but not in
# workflow/assets/expansionhunter_pd.hg38.json yet; cutoffs are still recorded for
# triage when those loci are added. pathogenic_min_repeats is STRchive
# pathogenic_min (https://strchive.org/; v2.28.0) used by _expanded(), except
# FMR1 which keeps the FXTAS/POI premutation floor (≥55) for PD triage while
# STRchive pathogenic_* is the FXS full mutation. Full age-of-onset /
# typical-onset / pathogenic / intermediate ranges are in
# workflow/assets/expansionhunter_catalog_sources.tsv. Motif purity,
# interruptions, and biallelic requirement (RFC1, CSTB, FXN) are not modelled.
str_loci:
  # --- In ExpansionHunter PD catalog (REPID) ---
  ATXN1:
    gene: ATXN1
    pathogenic_min_repeats: 39
    citation: "STRchive SCA1_ATXN1 (https://strchive.org/loci/sca1_atxn1/): pathogenic 39–91 (intermediate 36–38); GeneReviews NBK1184"
  ATXN2:
    gene: ATXN2
    pathogenic_min_repeats: 35
    citation: "STRchive SCA2_ATXN2 (https://strchive.org/loci/sca2_atxn2/): pathogenic 35–500 (intermediate 29–34); GeneReviews NBK1275"
  ATXN3:
    gene: ATXN3
    pathogenic_min_repeats: 60
    citation: "STRchive SCA3_ATXN3 (https://strchive.org/loci/sca3_atxn3/): pathogenic 60–87 (intermediate 45–59); GeneReviews NBK1196"
  CACNA1A:
    gene: CACNA1A
    pathogenic_min_repeats: 21
    citation: "STRchive SCA6_CACNA1A (https://strchive.org/loci/sca6_cacna1a/): pathogenic 21–33 (intermediate 19–20); GeneReviews NBK1140"
  ATXN7:
    gene: ATXN7
    pathogenic_min_repeats: 37
    citation: "STRchive SCA7_ATXN7 (https://strchive.org/loci/sca7_atxn7/): pathogenic 37–460 (intermediate 28–35); GeneReviews NBK1256"
  ATXN8OS:
    gene: ATXN8OS
    pathogenic_min_repeats: 71
    citation: "STRchive SCA8_ATXN8OS (https://strchive.org/loci/sca8_atxn8os/): pathogenic 71–1300 (intermediate 50–70); GeneReviews NBK1268; EH REPID is CTG tract alone"
  ATXN10:
    gene: ATXN10
    pathogenic_min_repeats: 800
    citation: "STRchive SCA10_ATXN10 (https://strchive.org/loci/sca10_atxn10/): pathogenic 800–4500 (intermediate 33–850); GeneReviews NBK1175"
  PPP2R2B:
    gene: PPP2R2B
    pathogenic_min_repeats: 51
    citation: "STRchive SCA12_PPP2R2B (https://strchive.org/loci/sca12_ppp2r2b/): pathogenic 51–78 (intermediate 40–49); GeneReviews NBK535148"
  TBP:
    gene: TBP
    pathogenic_min_repeats: 49
    citation: "STRchive SCA17_TBP (https://strchive.org/loci/sca17_tbp/): pathogenic 49–66 (intermediate/reduced 41–48); GeneReviews NBK1438"
  FMR1:
    gene: FMR1
    pathogenic_min_repeats: 55
    citation: "STRchive FXS_FMR1 (https://strchive.org/loci/fxs_fmr1/): FXS pathogenic 201–2000; FXTAS/POI premutation ~55–200 — PD triage floor 55; GeneReviews NBK1384"
  C9ORF72:
    gene: C9ORF72
    pathogenic_min_repeats: 31
    citation: "STRchive FTDALS1_C9orf72 (https://strchive.org/loci/ftdals1_c9orf72/): pathogenic 31–4088 (intermediate 24–30); GeneReviews NBK268647"
  RFC1:
    gene: RFC1
    pathogenic_min_repeats: 400
    citation: "STRchive CANVAS_RFC1 (https://strchive.org/loci/canvas_rfc1/): pathogenic 400–2750 (intermediate 11–200); biallelic and motif-specific — EH size alone is a triage flag; GeneReviews NBK564656"
  HTT:
    gene: HTT
    pathogenic_min_repeats: 36
    citation: "STRchive HD_HTT (https://strchive.org/loci/hd_htt/): pathogenic 36–250 (intermediate 27–35); GeneReviews NBK1305"
  AR:
    gene: AR
    pathogenic_min_repeats: 38
    citation: "STRchive SBMA_AR (https://strchive.org/loci/sbma_ar/): pathogenic 38–68 (intermediate 36–37); GeneReviews NBK1333"
  ATN1:
    gene: ATN1
    pathogenic_min_repeats: 48
    citation: "STRchive DRPLA_ATN1 (https://strchive.org/loci/drpla_atn1/): pathogenic 48–93 (intermediate 36–47); GeneReviews NBK1491"
  NOP56:
    gene: NOP56
    pathogenic_min_repeats: 650
    citation: "STRchive SCA36_NOP56 (https://strchive.org/loci/sca36_nop56/): pathogenic 650–2500 (intermediate 15–649); GeneReviews NBK535148"
  JPH3:
    gene: JPH3
    pathogenic_min_repeats: 40
    citation: "STRchive HDL2_JPH3 (https://strchive.org/loci/hdl2_jph3/): pathogenic 40–60 (intermediate 29–39); GeneReviews NBK1529"
  GIPC1:
    gene: GIPC1
    pathogenic_min_repeats: 73
    citation: "STRchive OPDM2_GIPC1 (https://strchive.org/loci/opdm2_gipc1/): pathogenic 73–164; GeneReviews NBK535148"
  CSTB:
    gene: CSTB
    pathogenic_min_repeats: 30
    citation: "STRchive EPM1_CSTB (https://strchive.org/loci/epm1_cstb/): pathogenic 30–125; AR — biallelic expansion required; GeneReviews NBK1142"
  # --- PD-relevant, not yet in vendored EH catalog ---
  NOTCH2NLC:
    gene: NOTCH2NLC
    pathogenic_min_repeats: 66
    citation: "STRchive NIID_NOTCH2NLC (https://strchive.org/loci/niid_notch2nlc/): pathogenic 66–517 (intermediate 38–65); GeneReviews NBK535148"
  FGF14:
    gene: FGF14
    pathogenic_min_repeats: 320
    citation: "STRchive SCA27B_FGF14 (https://strchive.org/loci/sca27b_fgf14/): pathogenic 320–937 (intermediate 180–319); GeneReviews NBK599589"
  BEAN1:
    gene: BEAN1
    pathogenic_min_repeats: 110
    citation: "STRchive SCA31_BEAN1 (https://strchive.org/loci/sca31_bean1/): pathogenic 110–760 TGGAA/AATGG; GeneReviews NBK535148; not in vendored EH catalog yet"
  LRP12:
    gene: LRP12
    pathogenic_min_repeats: 85
    citation: "STRchive OPDM1_LRP12 (https://strchive.org/loci/opdm1_lrp12/): pathogenic 85–289; GeneReviews NBK535148; not in vendored EH catalog yet"
  FXN:
    gene: FXN
    pathogenic_min_repeats: 56
    citation: "STRchive FRDA_FXN (https://strchive.org/loci/frda_fxn/): pathogenic 56–1700 (intermediate 34–55); AR — biallelic expansion required; GeneReviews NBK1281"
