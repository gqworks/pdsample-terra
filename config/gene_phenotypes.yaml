# Expected phenotype profile per gene, used for phenotype-genotype concordance.
# Covers every Symbol in resources/panel/monopdaus-gene-inheritance.csv (GBA is keyed as GBA1,
# C19orf12 as C19ORF12 because lookups upper-case the gene symbol).
# This is a starter literature synthesis (GeneReviews, OMIM, MDSGene reviews), not a formal
# systematic review. It must be reviewed by a clinician / movement-disorder expert before the
# concordance output is used for anything beyond triage. Sources and confidence per gene are in
# config/gene_phenotypes.SOURCES.md.
# Fields:
#   moi:              AD / AR / XL / risk / unknown
#   onset_range:      [min, max] typical age of onset (years) of the neurological presentation,
#                     including documented later-onset parkinsonism. Omitted when the literature
#                     gives no usable anchor; onset is then not scored (+2 / -2 never applies).
#   key_features:     keywords expected in symptom descriptions (case-insensitive substring match)
#   atypical_features: keywords that, if present, raise suspicion of this gene
#   enriched_ancestry: ancestries where the gene / specific variants are more common
#                     (case-insensitive substring of the ethnicity text)
# Keywords are short substrings so they hit free-text symptom fields. Generic PD words
# (tremor, gait, dyskinesia) are avoided on differential genes so a typical PD picture with an
# onset outside the range ends up unmatched rather than matched.

